<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🎉</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico?v=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      overflow: hidden;
      animation: fadeIn 1s ease;
    }

    .card {
      background: rgba(255,255,255,0.3);
      padding: 50px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      animation: pop 0.6s ease;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      font-size: 16px;
      opacity: 0.8;
    }

    .highlight {
      font-weight: bold;
      color: #ff4d6d;
    }

    @keyframes pop {
      from {transform: scale(0.7); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🎉 ¡Lo lograste! 🎉</h1>

    <h2>Soy <span class="highlight">César Chunga</span></h2>

    <p>¿Te lo esperabas?</p>
    <p>Mañana dime si acertaste </p>
  </div>

</body>
</html>
